[package]
name = "viby"
version = "0.1.0"
description = "A modern, minimal, aesthetic local music player"
authors = ["Phuditsaphat Srisuphan"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
name = "viby_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio playback engine — rodio wraps cpal (hardware I/O) and symphonia (decoding)
# We disable default features to avoid claxon/minimp3 which don't support seeking,
# and strictly use symphonia for everything.
rodio = { version = "0.20", default-features = false, features = [
  "symphonia-all",
] }
symphonia = { version = "0.5.4", features = ["all"] }
cpal = "0.15.3"

# Audio metadata/tag reading — unified API for ID3, Vorbis, MP4, etc.
lofty = "0.22"

# SQLite database — stores the indexed music library locally
rusqlite = { version = "0.34", features = ["bundled"] }

# Async runtime — needed for Tauri commands and background tasks
tokio = { version = "1", features = ["full"] }

# UUID generation — for unique IDs (playlists, queue items)
uuid = { version = "1", features = ["v4"] }

# File path globbing — for scanning music directories
walkdir = "2"

# Audiophile-grade IIR filtering: TDF2 biquads, SVF (ZDF), auto preamp, export formats
math-iir-fir = "0.5"

# High-quality audio resampling for oversampling EQ
rubato = "0.14"

# Ergonomic error type derivation
thiserror = "1"

# Discord Rich Presence — shows current track in Discord status
discord-rich-presence = "1"
libc = "0.2"

# HTTP client for iTunes artwork lookups (Discord CDN can't reach localhost)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

tauri-plugin-single-instance = "2.4.2"
souvlaki = "0.8.3"
window-vibrancy = "0.6.0"
ebur128-stream = "0.2.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[patch.crates-io]
souvlaki = { path = "vendor/souvlaki" }


[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.16.0"
webkit2gtk = { version = "2.0.2", features = ["v2_34"] }

# Optimize dependencies even in debug builds to prevent audio crackling during FLAC playback
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
